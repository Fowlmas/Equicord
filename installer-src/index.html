<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Equicord Installer</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: #0c0d10;
            color: #dbdee1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        .titlebar {
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #949ba4;
        }

        .titlebar .title {
            color: #5865f2;
        }

        .titlebar .win-controls {
            -webkit-app-region: no-drag;
            display: flex;
            gap: 4px;
        }

        .titlebar button {
            width: 28px;
            height: 24px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #949ba4;
            cursor: pointer;
            font-size: 14px;
        }

        .titlebar button:hover {
            background: #23242a;
            color: #fff;
        }

        .titlebar button.close:hover {
            background: #da373c;
            color: #fff;
        }

        .content {
            flex: 1;
            padding: 4px 24px 0;
            overflow: hidden;
        }

        .page {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        .page.active {
            display: flex;
        }

        h2 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            margin: 4px 0 16px;
            color: #fff;
        }

        h2 svg {
            flex-shrink: 0;
            color: #5865f2;
        }

        .row-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .action-row,
        .channel-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1.5px solid #26272c;
            background: #17181c;
            cursor: pointer;
            transition: all .12s;
        }

        .action-row:hover {
            border-color: #3a3c42;
        }

        .action-row.selected {
            border-color: #5865f2;
            background: rgba(88, 101, 242, 0.12);
        }

        .action-row svg {
            flex-shrink: 0;
            color: #dbdee1;
        }

        .action-row.selected svg {
            color: #5865f2;
        }

        .action-row span {
            font-size: 13px;
            font-weight: 600;
        }

        .channel-row {
            cursor: pointer;
        }

        .channel-row.selected {
            border-color: #5865f2;
            background: rgba(88, 101, 242, 0.12);
        }

        .channel-row:not(.found) {
            cursor: not-allowed;
            opacity: .6;
        }

        .channel-row .icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .channel-row .icon img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
        }

        .channel-row .info {
            flex: 1;
            min-width: 0;
        }

        .channel-row .info .label {
            font-size: 13px;
            font-weight: 600;
        }

        .channel-row .info .path {
            font-size: 11px;
            color: #949ba4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .channel-row.found .info .path {
            color: #3ba55c;
        }

        .channel-row button {
            flex-shrink: 0;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            background: #2b2d31;
            color: #dbdee1;
            cursor: pointer;
        }

        .channel-row button:hover {
            background: #3a3c42;
        }

        #log {
            flex: 1;
            background: #111214;
            border-radius: 6px;
            padding: 10px 12px;
            font-family: Consolas, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            overflow-y: auto;
            color: #b5bac1;
        }

        .footer {
            -webkit-app-region: no-drag;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px 18px;
        }

        .footer .socials {
            display: flex;
            gap: 10px;
            color: #4e5058;
        }

        .footer .nav {
            display: flex;
            gap: 8px;
        }

        .footer button {
            padding: 9px 20px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        #backBtn {
            background: #2b2d31;
            color: #dbdee1;
        }

        #backBtn:hover:not(:disabled) {
            background: #3a3c42;
        }

        #nextBtn {
            background: #5865f2;
            color: #fff;
        }

        #nextBtn:hover:not(:disabled) {
            opacity: .9;
        }

        .footer button:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .warning {
            font-size: 11px;
            color: #f0b232;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <div class="titlebar">
        <span><span class="title">Equicord</span> Installer</span>
        <div class="win-controls">
            <button id="minBtn" title="Minimize">&#x2013;</button>
            <button id="closeBtn" class="close" title="Close">&#x2715;</button>
        </div>
    </div>

    <div class="content">
        <section class="page active" id="page-action">
            <h2>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="9" />
                </svg>
                Choose an Action
            </h2>
            <div class="row-list">
                <div class="action-row" data-action="install">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    <span>Install Equicord</span>
                </div>
                <div class="action-row" data-action="repair">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
                    </svg>
                    <span>Repair Equicord</span>
                </div>
                <div class="action-row" data-action="uninstall">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6" />
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        <line x1="10" y1="11" x2="10" y2="17" />
                        <line x1="14" y1="11" x2="14" y2="17" />
                    </svg>
                    <span>Uninstall Equicord</span>
                </div>
            </div>
        </section>

        <section class="page" id="page-channels">
            <h2>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 6L9 17l-5-5" />
                </svg>
                Choose Discord Versions
            </h2>
            <div class="row-list" id="channelList"></div>
        </section>

        <section class="page" id="page-run">
            <h2>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z" />
                </svg>
                <span id="runTitle">Working...</span>
            </h2>
            <div id="log">Ready.</div>
            <p class="warning">Discord will be closed and reopened automatically.</p>
        </section>
    </div>

    <div class="footer">
        <div class="socials"></div>
        <div class="nav">
            <button id="backBtn" disabled>Back</button>
            <button id="nextBtn" disabled>Next</button>
        </div>
    </div>

    <script>
        function channelLogo(id) {
            return `<img src="assets/images/${id}.png" alt="${id}" />`;
        }

        const pages = ["page-action", "page-channels", "page-run"];
        let pageIndex = 0;
        let selectedAction = null;
        let selectedChannelPath = null;

        const backBtn = document.getElementById("backBtn");
        const nextBtn = document.getElementById("nextBtn");
        const channelList = document.getElementById("channelList");

        document.getElementById("minBtn").onclick = () => window.installer.minimize();
        document.getElementById("closeBtn").onclick = () => window.installer.close();

        function showPage(i) {
            pages.forEach((id, idx) => document.getElementById(id).classList.toggle("active", idx === i));
            backBtn.disabled = i === 0;
            backBtn.style.visibility = i === pages.length - 1 ? "hidden" : "visible";
            nextBtn.style.visibility = i === pages.length - 1 ? "hidden" : "visible";
        }

        document.querySelectorAll(".action-row").forEach(row => {
            row.onclick = () => {
                document.querySelectorAll(".action-row").forEach(r => r.classList.remove("selected"));
                row.classList.add("selected");
                selectedAction = row.dataset.action;
                nextBtn.disabled = false;
            };
        });

        let channelPaths = {};

        function selectChannel(id, row) {
            document.querySelectorAll(".channel-row").forEach(r => r.classList.remove("selected"));
            row.classList.add("selected");
            selectedChannelPath = channelPaths[id].base;
            nextBtn.disabled = !selectedChannelPath;
        }

        async function renderChannels() {
            channelList.innerHTML = "";
            channelPaths = await window.installer.detectDiscord();
            selectedChannelPath = null;

            for (const [id, { label, path }] of Object.entries(channelPaths)) {
                const row = document.createElement("div");
                row.className = "channel-row" + (path ? " found" : "");
                row.innerHTML = `
                    <div class="icon">${channelLogo(id)}</div>
                    <div class="info">
                        <div class="label">${label}</div>
                        <div class="path">${path || "Not Found"}</div>
                    </div>
                    <button data-channel="${id}">Browse</button>
                `;
                row.onclick = () => {
                    if (channelPaths[id].path) selectChannel(id, row);
                };
                row.querySelector("button").onclick = async event => {
                    event.stopPropagation();
                    const picked = await window.installer.browseDiscord();
                    if (!picked) return;
                    channelPaths[id].path = picked.display;
                    channelPaths[id].base = picked.base;
                    row.classList.add("found");
                    row.querySelector(".path").textContent = picked.display;
                    selectChannel(id, row);
                };
                channelList.appendChild(row);
            }
            nextBtn.disabled = true;
        }

        async function runAction() {
            document.getElementById("runTitle").textContent =
                selectedAction === "install" ? "Installing..." : selectedAction === "repair" ? "Repairing..." : "Uninstalling...";
            const logEl = document.getElementById("log");
            logEl.textContent = `Running ${selectedAction} on ${selectedChannelPath}...\n`;
            const result = await window.installer.runAction(selectedAction, selectedChannelPath);
            logEl.textContent += result.logs.join("\n");
            logEl.textContent += result.ok ? "\n\nDone." : "\n\nFailed, see above.";
            document.getElementById("runTitle").textContent = result.ok ? "Done!" : "Failed";
        }

        nextBtn.onclick = async () => {
            if (pageIndex === 0) {
                pageIndex = 1;
                showPage(pageIndex);
                nextBtn.disabled = true;
                nextBtn.textContent = selectedAction === "install" ? "Install" : selectedAction === "repair" ? "Repair" : "Uninstall";
                await renderChannels();
            } else if (pageIndex === 1) {
                pageIndex = 2;
                showPage(pageIndex);
                await runAction();
            }
        };

        backBtn.onclick = () => {
            if (pageIndex > 0) {
                pageIndex -= 1;
                showPage(pageIndex);
                if (pageIndex === 0) nextBtn.textContent = "Next";
            }
        };

        showPage(0);
    </script>
</body>

</html>
